<!DOCTYPE html>
<html>
<head>
    <title>Environment Monitoring Dashboard</title>

    <style>
        body { font-family: Arial; margin: 30px; background:#f5f5f5; }
        h1 { color:#2c3e50; }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #333;
            text-align: center;
        }

        th {
            background: #4CAF50;
            color: white;
        }

        tr:nth-child(even){
            background:#eee;
        }
    </style>
</head>

<body>

<h1>Smart Environment Monitoring Dashboard</h1>

<table>
<tr>
    <th>ID</th>
    <th>Temperature (°C)</th>
    <th>Humidity (%)</th>
    <th>Gas Value</th>
    <th>Timestamp</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
